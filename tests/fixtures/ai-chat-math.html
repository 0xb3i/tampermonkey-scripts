<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>AI Chat with Math Formulas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 40px auto; background: #1a1a2e; color: #e0e0e0; }
    .message { background: #16213e; border-radius: 12px; padding: 16px 20px; margin: 12px 0; position: relative; line-height: 1.8; }
    .message.assistant { background: #0f3460; }
    .copy-btn { position: absolute; top: 8px; right: 8px; background: #533483; border: none; color: white; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .copy-btn:hover { background: #7b2cbf; }
    .katex-display { margin: 12px 0; }
    #paste-area { width: 100%; height: 120px; margin-top: 20px; background: #16213e; color: #e0e0e0; border: 1px solid #533483; border-radius: 8px; padding: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <h2>🤖 AI Chat with Math Formulas</h2>

  <div class="message assistant" id="msg1">
    <button class="copy-btn" onclick="copyMessage('msg1')">复制</button>
    <div class="content"></div>
  </div>

  <div class="message assistant" id="msg2">
    <button class="copy-btn" onclick="copyMessage('msg2')">复制</button>
    <div class="content"></div>
  </div>

  <div class="message assistant" id="msg3">
    <button class="copy-btn" onclick="copyMessage('msg3')">复制</button>
    <div class="content"></div>
  </div>

  <div class="message assistant" id="msg4">
    <button class="copy-btn" onclick="copyMessage('msg4')">复制</button>
    <div class="content"></div>
  </div>

  <h3>粘贴区域</h3>
  <textarea id="paste-area" placeholder="Ctrl+V 粘贴到这里验证..."></textarea>

  <script>
    function renderMath(element, text, displayMode) {
      katex.render(text, element, { throwOnError: false, displayMode: displayMode });
    }

    function renderMixedContent(container, content) {
      var parts = content.split(/(\$\$[\s\S]*?\$\$|\$[^$]+?\$)/g);
      parts.forEach(function(part) {
        if (part.startsWith('$$') && part.endsWith('$$')) {
          var tex = part.slice(2, -2).trim();
          var span = document.createElement('span');
          span.className = 'katex-display';
          container.appendChild(span);
          katex.render(tex, span, { throwOnError: false, displayMode: true });
        } else if (part.startsWith('$') && part.endsWith('$')) {
          var tex2 = part.slice(1, -1).trim();
          var span2 = document.createElement('span');
          container.appendChild(span2);
          katex.render(tex2, span2, { throwOnError: false, displayMode: false });
        } else if (part) {
          container.appendChild(document.createTextNode(part));
        }
      });
    }

    renderMixedContent(
      document.querySelector('#msg1 .content'),
      '梯度下降的更新规则为 $$\\nabla_\\theta J(\\theta) = \\mathbb{E}_{\\pi_\\theta}[\\nabla_\\theta \\log \\pi_\\theta \\cdot A]$$ 其中 $A$ 是优势函数。'
    );

    renderMixedContent(
      document.querySelector('#msg2 .content'),
      '欧拉公式：$e^{i\\pi} + 1 = 0$，这是数学中最优美的公式之一。'
    );

    renderMixedContent(
      document.querySelector('#msg3 .content'),
      '贝叶斯定理可以表示为：$$P(A|B) = \\frac{P(B|A) \\cdot P(A)}{P(B)}$$ 其中 $P(A|B)$ 是后验概率，$P(B|A)$ 是似然，$P(A)$ 是先验概率。'
    );

    renderMixedContent(
      document.querySelector('#msg4 .content'),
      '这是一段没有公式的普通文本。'
    );

    function copyMessage(msgId) {
      var content = document.querySelector('#' + msgId + ' .content').textContent;
      navigator.clipboard.writeText(content).then(function() {
        var btn = document.querySelector('#' + msgId + ' .copy-btn');
        btn.textContent = '已复制';
        setTimeout(function() { btn.textContent = '复制'; }, 2000);
      });
    }
  </script>
</body>
</html>
