<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Tampermonkey Scripts</title>
  <desc id="desc">Tampermonkey Scripts，收录 Tap To Tab：短按链接照常跳转，按住 300ms 再松开则在新标签页打开。右侧以时间轴示意两种松开结果。</desc>

  <rect width="1200" height="320" rx="24" fill="#18181B"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Segoe UI', sans-serif">
    <text x="72" y="150" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#F4F4F5">Tampermonkey Scripts</text>
    <text x="74" y="204" font-size="26" fill="#A1A1AA"><tspan fill="#F4F4F5" font-weight="600">Tap To Tab</tspan>：短按照常跳转，</text>
    <text x="74" y="242" font-size="26" fill="#A1A1AA">按住 300ms 再松开，在新标签页打开</text>
  </g>

  <g id="hold-timeline" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
    <g id="link">
      <rect x="752" y="80" width="200" height="50" rx="8" fill="none" stroke="#F59E0B" stroke-width="2"/>
      <text x="772" y="113" font-size="22" fill="#F4F4F5" text-decoration="underline">稍后再读的文章</text>
      <path d="M918 116 L918 146 L925 139 L930 151 L936 149 L931 137 L941 137 Z" fill="#F4F4F5" stroke="#18181B" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g id="axis">
      <path d="M760 196 H912" stroke="#52525B" stroke-width="6" stroke-linecap="round"/>
      <path d="M912 196 H1120" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
      <circle cx="912" cy="196" r="9" fill="#18181B" stroke="#F59E0B" stroke-width="3"/>
      <text x="912" y="176" font-size="18" fill="#F59E0B" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">300ms</text>
      <text x="760" y="236" font-size="20" fill="#A1A1AA">短按 · 原页跳转</text>
      <text x="1120" y="236" font-size="20" fill="#F4F4F5" text-anchor="end">按住 · 新标签页</text>
    </g>
  </g>
</svg>
