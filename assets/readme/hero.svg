<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Tampermonkey Scripts — Tap To Tab</title>
  <desc id="desc">Tap To Tab userscript hero showing short-press native navigation versus 300ms long-press blue outline to open in a new tab.</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1419"/>
      <stop offset="100%" stop-color="#141C26"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg-grad)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="23.5" fill="none" stroke="#263241"/>

  <!-- Left Title Block -->
  <g transform="translate(56 54)">
    <rect x="0" y="0" width="286" height="32" rx="16" fill="#182230" stroke="#2D3E52"/>
    <circle cx="18" cy="16" r="5" fill="#3B82F6"/>
    <text x="32" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#93C5FD" letter-spacing="0.4">TAMPERMONKEY · v0.4.1</text>

    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="52" font-weight="750" fill="#F8FAFC" letter-spacing="-0.8">Tampermonkey Scripts</text>
    <text x="0" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="500" fill="#CBD5E1">短按链接原生跳转，长按 300ms 出现蓝框后松开，</text>
    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="500" fill="#CBD5E1">在后台新标签页打开 — 专为触控板防抖优化。</text>

    <g transform="translate(0 202)">
      <rect x="0" y="0" width="136" height="34" rx="8" fill="#182230" stroke="#2A384A"/>
      <text x="16" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#E2E8F0">Hold 300ms</text>

      <rect x="150" y="0" width="166" height="34" rx="8" fill="#182230" stroke="#2A384A"/>
      <text x="166" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#E2E8F0">Drift 96px / 32px</text>

      <rect x="330" y="0" width="134" height="34" rx="8" fill="#182230" stroke="#2A384A"/>
      <text x="346" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#93C5FD">Node 20+ Test</text>
    </g>
  </g>

  <!-- Right Proof Panel: Short Press vs Long Press -->
  <g transform="translate(680 42)">
    <rect x="0" y="0" width="464" height="256" rx="18" fill="#131B24" stroke="#263241"/>

    <!-- Browser top bar -->
    <rect x="0" y="0" width="464" height="38" rx="18" fill="#1A2431"/>
    <rect x="0" y="20" width="464" height="18" fill="#1A2431"/>
    <circle cx="22" cy="19" r="5" fill="#475569"/>
    <circle cx="40" cy="19" r="5" fill="#475569"/>
    <circle cx="58" cy="19" r="5" fill="#475569"/>
    <rect x="86" y="9" width="170" height="20" rx="6" fill="#0F1419"/>
    <text x="98" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94A3B8">tap-to-tab.user.js</text>

    <!-- Tab 2 indicator -->
    <rect x="266" y="7" width="138" height="24" rx="7" fill="#1E3A5F" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="280" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#BFDBFE">+ 新标签页打开</text>

    <!-- Case 1: Short press -->
    <g transform="translate(24 58)">
      <rect x="0" y="0" width="416" height="74" rx="12" fill="#0F1419" stroke="#232F3E"/>
      <text x="18" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#94A3B8">SHORT PRESS &lt; 300ms</text>
      <text x="18" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#E2E8F0">普通点击不被拦截 · 保持原生跳转</text>
      <rect x="334" y="18" width="66" height="36" rx="8" fill="#1E293B"/>
      <text x="348" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#CBD5E1">_self</text>
    </g>

    <!-- Case 2: Long press armed -->
    <g transform="translate(24 148)">
      <rect x="0" y="0" width="416" height="84" rx="12" fill="#111C2D" stroke="#3B82F6" stroke-width="2.5"/>
      <text x="18" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#60A5FA">HOLD ≥ 300ms · 蓝框激活</text>
      <text x="18" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="19" font-weight="600" fill="#F8FAFC">松开鼠标左键 → 在新标签页打开链接</text>
      <rect x="364" y="22" width="36" height="36" rx="8" fill="#1D4ED8"/>
      <path d="M376 46 L388 34 M379 34 L388 34 L388 43" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
</svg>
