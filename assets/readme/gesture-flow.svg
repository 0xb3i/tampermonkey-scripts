<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Tap To Tab 手势生命周期</title>
  <desc id="desc">Three-stage gesture lifecycle: Pointer Down with 96px tolerance, 300ms Blue Outline Arming with 32px tolerance, and Pointer Up opening in a new tab.</desc>

  <rect width="1200" height="250" rx="20" fill="#0F1419"/>
  <rect x="0.5" y="0.5" width="1199" height="249" rx="19.5" fill="none" stroke="#263241"/>

  <text x="48" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#F1F5F9">手势状态机 · 两阶段容差控制</text>

  <!-- Step 1 -->
  <g transform="translate(48 74)">
    <rect x="0" y="0" width="332" height="136" rx="14" fill="#161D26" stroke="#2A384A"/>
    <text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#94A3B8">01 · POINTER DOWN</text>
    <text x="22" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="600" fill="#F8FAFC">按下左键启动计时</text>
    <text x="22" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#CBD5E1">蓝框出现前允许 96px 漂移</text>
    <text x="22" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" fill="#64748B">防止触控板轻微抖动打断触发</text>
  </g>

  <path d="M394 142 L426 142 M418 134 L426 142 L418 150" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Step 2 -->
  <g transform="translate(434 74)">
    <rect x="0" y="0" width="332" height="136" rx="14" fill="#111C2D" stroke="#3B82F6" stroke-width="2"/>
    <text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#60A5FA">02 · ARMED AT 300ms</text>
    <text x="22" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="600" fill="#F8FAFC">链接显示蓝色轮廓</text>
    <text x="22" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#CBD5E1">触发后移动超过 32px 可取消</text>
    <text x="22" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" fill="#93C5FD">松开前随时可滑出放弃</text>
  </g>

  <path d="M780 142 L812 142 M804 134 L812 142 L804 150" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Step 3 -->
  <g transform="translate(820 74)">
    <rect x="0" y="0" width="332" height="136" rx="14" fill="#161D26" stroke="#2A384A"/>
    <text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#34D399">03 · RELEASE</text>
    <text x="22" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" font-weight="600" fill="#F8FAFC">新标签页打开链接</text>
    <text x="22" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#CBD5E1">抑制后续原生 click 事件</text>
    <text x="22" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" fill="#64748B">修饰键、锚点与编辑区保持原行为</text>
  </g>
</svg>
